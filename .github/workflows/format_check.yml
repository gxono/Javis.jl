name: format-check

on:
  push:
    branches:
      - 'main'
    tags: '*'
  pull_request:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        julia-version: ['1']
        os: [ubuntu-latest]
    steps:
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.julia-version }}

      - uses: actions/checkout@v7
      - name: Install JuliaFormatter and format
        run: |
          # Pinned to the 1.x line: JuliaFormatter 2.x reformats code that 1.x
          # already considers compliant (different line-wrapping heuristics),
          # which would make this check fail on unrelated, untouched files
          # every time a new major JuliaFormatter version comes out.
          julia  -e 'using Pkg; Pkg.add(name="JuliaFormatter", version="1")'
          julia  -e 'using JuliaFormatter; format(".", annotate_untyped_fields_with_any=false, always_for_in=true, whitespace_in_kwargs=true, whitespace_ops_in_indices=true)'
      - name: Format check
        run: |
          julia -e '
          out = Cmd(`git diff --name-only`) |> read |> String
          if out == ""
              exit(0)
          else
              @error "Some files have not been formatted !!!"
              write(stdout, out)
              exit(1)
          end'
      

